services:
  puppeteer:
    build: .
    container_name: puppeteer-service
    ports:
      - "4100:4000"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: node puppeteer-server.js
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      UCRM_DB_HOST: ${UCRM_DB_HOST}
      UCRM_DB_USER: ${UCRM_DB_USER}
      UCRM_DB_PASS: ${UCRM_DB_PASS}
      UCRM_DB_NAME: ${UCRM_DB_NAME}
    depends_on:
      - db
    networks:
      - unms_internal
      - public_net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: oxxo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - oxxo_db_data:/var/lib/postgresql/data
    networks:
      - unms_internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-service
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9003}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9002}
    command: server /data --console-address ":9001"
    networks:
      - unms_internal
      - public_net
    restart: unless-stopped

  pdf-cropper:
    build: ./pdf-cropper
    container_name: pdf-cropper-service
    ports:
      - "8050:8000"
    networks:
      - unms_internal
    restart: unless-stopped

volumes:
  oxxo_db_data:
  minio_data:

networks:
  unms_internal:
    external: true
    name: app_internal
  public_net:
    driver: bridge
