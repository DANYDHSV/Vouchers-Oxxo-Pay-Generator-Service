version: '3'

services:
  puppeteer:
    image: alekzonder/puppeteer:latest
    container_name: puppeteer-service
    ports:
      - "4100:4100"
    volumes:
      - .:/app
    working_dir: /app
    command: node puppeteer-server.js
    environment:
      - NODE_ENV=production

  php:
    image: php:8.1-cli
    container_name: php-service
    volumes:
      - .:/app
    working_dir: /app
